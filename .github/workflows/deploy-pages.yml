name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Work out the site URL and base path
        id: site
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "${owner}.github.io" ]; then
            # User site: https://<owner>.github.io/
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
          else
            # Project site: https://<owner>.github.io/<repo>/
            echo "base_path=/${repo}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build static site
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          # A custom domain can be set as a repository variable SITE_URL.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || steps.site.outputs.site_url }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
